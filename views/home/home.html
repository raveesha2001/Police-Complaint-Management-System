<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home | Complaint Management System · Sri Lanka Police</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.18/dist/css/bootstrap-select.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <link rel="stylesheet" href="../../assets/css/common.css">
  <link rel="stylesheet" href="home.css">
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="app-header">
    <div class="container app-container">
      <a href="home.html" class="app-brand">
        <img src="../../assets/img/police-logo.png" alt="Sri Lanka Police emblem">
        <div>
          <strong>Sri Lanka Police</strong>
          <small>Complaint Management System</small>
        </div>
      </a>

      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="moduleSearch" class="form-control" placeholder="Search modules" autocomplete="off" aria-label="Search modules">
        <kbd>/</kbd>
      </div>

      <div class="dropdown user-menu">
        <button type="button" class="user-btn dropdown-toggle" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
          <span id="userName" class="user-name">User</span>
          <span id="userAvatar" class="avatar">U</span>
        </button>
        <div class="dropdown-menu dropdown-menu-right">
          <a class="dropdown-item" href="../change-password/change-password.html"><i class="fas fa-lock mr-2"></i>Change password</a>
          <div class="dropdown-divider"></div>
          <a class="dropdown-item" href="#" id="btnLogout"><i class="fas fa-sign-out-alt mr-2"></i>Sign out</a>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== Main ===== -->
  <main class="container app-container flex-grow-1">
    <section class="welcome">
      <h1>Welcome back, <span id="welcomeName">User</span></h1>
      <div class="welcome-bar"></div>
      <p>Pick a module to get started.</p>
    </section>

    <div id="moduleSections"></div>

    <div id="noResults" class="no-results" hidden>
      <i class="fas fa-search"></i>
      <p>No modules match your search.</p>
    </div>
  </main>

  <footer class="app-footer">Powered by Sri Lanka Telecom</footer>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap-select@1.13.18/dist/js/bootstrap-select.min.js"></script>
  <script src="../../assets/js/common.js"></script>
  <script src="home.js"></script>
</body>
</html>
